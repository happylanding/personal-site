# CNB 流水线：构建验证 + 自动同步到 GitHub（Cloudflare 部署源）
#
# 使用方式（首次配置）：
#   1. 在 GitHub 生成一个具备 repo 权限的 Personal Access Token（见 docs/github-sync.md）
#   2. 在 CNB 创建「密钥仓库」Galvin2026/secret，在其中新建文件 github-sync.yml：
#        GITHUB_USERNAME: happylanding
#        GITHUB_ACCESS_TOKEN: ghp_xxxxxxxxxxxxxxxxxxxx
#   3. 本文件已预填密钥仓库地址，无需再改；
#      但请务必先创建好密钥仓库和 github-sync.yml，再合并本 PR，否则 main 流水线会因找不到密钥文件而失败
#   4. 提交本文件后，每次 push 到 main 都会自动构建验证并同步到 GitHub
#
# 触发说明：
#   - push 到 main            → 构建验证 + 同步 main 到 GitHub（main 被精确匹配，$ 兜底不会重复执行）
#   - 任意非 main 分支 push   → 仅构建验证（$ 兜底匹配，不触发同步，避免把临时分支推上去）
#   - 每天 02:00 定时任务      → 兜底同步，防止漏推
#
# 说明：
#   - 两仓库（CNB 与 GitHub）没有共享 Git 历史，同步任务必须开启 force: true，
#     否则首次/后续推送会因 non-fast-forward 被拒；开启后以 CNB 的 main 为准覆盖推送。
#   - 分支匹配用 $ 兜底而不是 "*"，避免 main 同时被精确匹配和通配符匹配并行执行两条流水线。

main:
  push:
    - name: build-and-sync
      docker:
        image: node:22
      imports:
        - https://cnb.cool/Galvin2026/secret/-/blob/main/github-sync.yml
      stages:
        - name: install
          script: npm ci
        - name: build
          # 先自动解析 public/books/ 下的书本文件（生成在线阅读数据），再执行构建
          script: |
            node scripts/build-books.mjs
            npm run build
        - name: sync-to-github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/happylanding/personal-site.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_ACCESS_TOKEN}
            branch: main
            force: true
            git_user: ${GITHUB_USERNAME}
            git_email: galvin@users.noreply.github.com
  "crontab: 0 2 * * *":
    - name: nightly-sync
      imports:
        - https://cnb.cool/Galvin2026/secret/-/blob/main/github-sync.yml
      stages:
        - name: sync-to-github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/happylanding/personal-site.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_ACCESS_TOKEN}
            branch: main
            force: true
            git_user: ${GITHUB_USERNAME}
            git_email: galvin@users.noreply.github.com

$:
  push:
    - name: build-check
      docker:
        image: node:22
      stages:
        - name: install
          script: npm ci
        - name: build
          # 先自动解析 public/books/ 下的书本文件（生成在线阅读数据），再执行构建
          script: |
            node scripts/build-books.mjs
            npm run build

  # 云原生开发环境（点「云原生开发」按钮或 API 启动时生效）
  vscode:
    - docker:
        image: node:22
      services:
        - name: vscode
          options:
            # 离线保活时间：检测不到 http/ssh 连接时，超过 20 分钟才回收（默认 10 分钟）
            keepAliveTimeout: 20m
      stages:
        - name: install
          script: npm ci
        - name: start-dev
          # 先解析书本文件，再启动 dev server，保证新上传的书本可在线阅读
          script: |
            node scripts/build-books.mjs
            nohup npm run dev -- --host 0.0.0.0 > /tmp/astro-dev.log 2>&1 &
            sleep 5
            echo "--- dev server check ---"
            curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:4321/ || echo "not ready yet"
